<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G-code Review</title>
    <script>
      // Sets the theme before first paint so a light-mode visitor never sees a
      // flash of the dark page. Mirrors resolveInitialTheme() in
      // src/ui/theme.ts — keep the storage key in step.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('gcode-review-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="start-screen">
        <header class="app-header">
          <div class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 18h16M6 14h12M8 10h8M10 6h4" />
            </svg>
            <span>G-code Review</span>
          </div>
          <button class="theme-toggle" type="button">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
            </svg>
          </button>
        </header>

        <main class="start-main">
          <div class="start-intro">
            <h1>Review a G-code toolpath</h1>
            <p>Parsed and rendered entirely in your browser — the file is never uploaded.</p>
          </div>

          <div id="drop-zone" role="button" tabindex="0" aria-label="Open a G-code file">
            <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
            <p class="drop-title">Drop a G-code file here</p>
            <p class="drop-subtitle">or <span class="drop-link">browse your files</span></p>
            <p class="drop-formats">.gcode &middot; .gco &middot; .g</p>
            <input id="file-input" type="file" accept=".gcode,.gco,.g" />
          </div>

          <section id="example-files" aria-labelledby="examples-heading">
            <h2 id="examples-heading">Or open an example</h2>
            <ul id="example-file-list"></ul>
          </section>
        </main>
      </div>

      <div id="viewer" hidden>
        <canvas id="scene-canvas"></canvas>
        <aside id="sidebar">
          <button id="load-new">Load new .gcode</button>
          <div id="sidebar-content"></div>
          <section class="panel">
            <header class="panel-header">
              <h2>Measure</h2>
              <button id="measure-toggle" type="button" aria-pressed="false">Off</button>
            </header>
            <div id="measure-readout"></div>
            <button id="measure-clear" type="button" class="panel-action">Clear</button>
          </section>
          <section class="panel">
            <header class="panel-header">
              <h2>Analysis</h2>
              <button id="analysis-run" type="button">Re-run</button>
            </header>
            <div id="analysis-results"></div>
          </section>
        </aside>
        <div id="controls">
          <button id="play-pause">Play</button>
          <div id="scrub-mode" role="radiogroup" aria-label="Scrub by">
            <label><input type="radio" name="scrub-mode" id="mode-points" checked /> Points</label>
            <label><input type="radio" name="scrub-mode" id="mode-layers" /> Layers</label>
          </div>
          <input id="layer-scrubber" type="range" min="0" max="0" value="0" />
          <span id="layer-label">Point 0 / 0</span>
          <label><input id="toggle-travel" type="checkbox" checked /> Show travel</label>
          <label>
            Color by
            <select id="color-mode">
              <option value="move-type">Move type</option>
              <option value="speed">Speed</option>
              <option value="layer">Layer</option>
              <option value="feature">Feature type</option>
            </select>
          </label>
          <button id="settings-toggle" aria-expanded="false" aria-controls="settings-panel">Settings</button>
          <button class="theme-toggle" type="button">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
            </svg>
          </button>
        </div>
        <div id="settings-panel" hidden>
          <label>
            Render mode
            <select id="render-mode">
              <option value="tubes" selected>Tubes</option>
              <option value="lines">Lines</option>
            </select>
          </label>
          <label>
            Bead width
            <input id="extrusion-width" type="range" min="0.2" max="2.0" step="0.05" value="0.4" />
            <span id="extrusion-width-label">2 mm</span>
          </label>
          <label>
            Layer height
            <input id="layer-height" type="range" min="0.05" max="1.0" step="0.05" value="0.2" />
            <span id="layer-height-label">1 mm</span>
          </label>
          <label>
            Machine
            <select id="machine-select">
              <option value="fit-to-model">Fit to model</option>
            </select>
          </label>
          <label><input id="toggle-scale" type="checkbox" /> Show scale</label>
          <label><input id="toggle-bounding-box" type="checkbox" /> Show bounding box</label>
          <label><input id="toggle-issue-markers" type="checkbox" checked /> Highlight issues</label>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
